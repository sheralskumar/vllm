# Dragonfly-only override for branch dragonfly-qwen-only.
# Single GSM8K job on amd_mi300_dragon_1. No source_file_dependencies so
# manual Buildkite rebuilds always include this step (empty deps = always run).
#
# Fed into test-template-amd.j2 in buildkite-ci to generate the pipeline.

steps:

- label: Dragonfly GSM8K Eval (Qwen3-30B-A3B-Thinking-2507-FP8, MI300)
  timeout_in_minutes: 180
  mirror_hardwares: [amdexperimental, amdproduction, amdgfx942nightly, amdmi300]
  dind: false
  agent_pool: mi300_dragon_1
  working_dir: "/vllm-workspace/tests"
  commands:
  - export VLLM_WORKER_MULTIPROC_METHOD=spawn
  - pytest -s -v evals/gsm8k/test_gsm8k_correctness.py --config-list-file=../.buildkite/dragonfly/gsm8k-models.txt
