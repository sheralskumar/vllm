# In this file, you can add more tests to run either by adding a new step or
# adding a new command to an existing step. See different options here for examples.

# This script will be feed into Jinja template in `test-template-amd.j2` at
# https://github.com/vllm-project/buildkite-ci/blob/main/scripts/test-template-amd.j2
# to generate the final pipeline yaml file.

# Documentation
# label(str): the name of the test. emojis allowed.
# fast_check(bool): whether to run this on each commit on the fastcheck pipeline.
# fast_check_only(bool): run this test on the fastcheck pipeline only
# optional(bool): never run this test by default (i.e. need to unblock manually) unless it's a scheduled nightly run.
# soft_fail(bool): allow this step to fail without failing the entire pipeline (useful for flaky or experimental tests).
# command(str): the single command to run for tests. incompatible with commands.
# commands(list): the list of commands to run for the test. incompatible with command.
# mirror_hardwares(list): selector tags for AMD pipelines that should include the test.
# dind(bool): when false, run the job directly in the AMD Kubernetes pod.
#     When true or omitted, use the legacy Docker-in-Docker path.
# num_gpus(int): override the number of GPUs for the test. defaults to 1 GPU. currently supports 2,4.
# num_nodes(int): whether to simulate multi-node setup by launching multiple containers on one host,
#     in this case, commands must be specified. the first command runs on the first host, the second
#     command runs on the second host.
# timeout_in_minutes(int): sets a timeout for the step in minutes. if not specified, uses the default timeout.
# parallelism(int): number of parallel jobs to run for this step. enables test sharding using $$BUILDKITE_PARALLEL_JOB
#     and $$BUILDKITE_PARALLEL_JOB_COUNT environment variables.
# working_dir(str): specify the place where the command should execute, default to /vllm-workspace/tests
# source_file_dependencies(list): the list of prefixes to opt-in the test for, if empty, the test will always run.

# When adding a test
# - If the test belongs to an existing group, add it there
# - If the test is short, add to any existing step
# - If the test takes more than 10min, then it is okay to create a new step.
#   Note that all steps execute in parallel.


#####################################################################################################################################
#                                                                                                                                   #
#                                                             README                                                                #
#                                                                                                                                   #
#####################################################################################################################################
#                                                                                                                                   #
# IMPORTANT:                                                                                                                        #
#   * Currently AMD CI has MI250 agents, MI300 agents, and MI355 agents. All upcoming feature improvements are                      #
#         tracked in: https://github.com/vllm-project/vllm/issues/34994                                                             #
#                                                                                                                                   #
#-----------------------------------------------------------------------------------------------------------------------------------#
#                                                                                                                                   #
# NOTES:                                                                                                                            #
#   * [Pytorch Nightly Dependency Override Check]: if this test fails, it means the nightly torch version is not compatible with    #
#                                                  some of the dependencies. Please check the error message and add the package to  #
#                                                  whitelist in `/vllm/tools/pre_commit/generate_nightly_torch_test.py`.            #
#   * [Entrypoints Integration (LLM)]:                                                                                              #
#     - {`pytest -v -s entrypoints/llm/test_generate.py`}: It needs a clean process                                                 #
#     - {`pytest -v -s entrypoints/offline_mode`}: Needs to avoid interference with other tests                                     #
#   * [Engine / Engine (1 GPU) / e2e Scheduling / e2e Core / V1 e2e / Spec Decode / V1 Sample + Logits / V1 Core + KV + Metrics]:   #
#     - Previously a single "V1 Test e2e + engine" step, now split across multiple groups.                                          #
#     - V1 e2e (2/4 GPUs) uses 4 GPUs but is scheduled on 8-GPU machines for stability. See:                                        #
#       https://github.com/vllm-project/vllm/pull/31040                                                                             #
#   * [V1 Sample + Logits / V1 Core + KV + Metrics / V1 others (CPU)]:                                                              #
#     - Previously a single "V1 others" step, now split to avoid interference.                                                      #
#     - Integration test for streaming correctness (requires special branch for __harness__ lib).                                   #
#   * [V1 others (CPU)]: Split the tests to avoid interference                                                                      #
#   * [PyTorch Compilation Unit Tests]: Run unit tests defined directly under `compile/`, not including subdirectories, which       #
#                                       are usually heavier tests covered elsewhere. Use `find` to launch multiple instances        #
#                                       of pytest so that they do not suffer from:                                                  #
#                                       https://github.com/vllm-project/vllm/issues/28965                                           #
#   * [PyTorch Fullgraph Smoke Test]: Run smoke tests under fullgraph directory, except `test_full_graph.py` as it is a heavy       #
#                                     test that is covered in other steps. Use `find` to launch multiple instances of pytest        #
#                                     so that they do not suffer from: https://github.com/vllm-project/vllm/issues/28965            #
#   * [PyTorch Fullgraph]:                                                                                                          #
#     - Limit to no custom ops to reduce running time. Wrap with quotes to escape yaml and avoid starting `-k` string               #
#       with a `-`                                                                                                                  #
#     - Old E2E tests such as:                                                                                                      #
#           ```bash                                                                                                                 #
#           pytest -v -s compile/distributed/test_fusions_e2e.py -k 'TRITON and not +quant_fp8 and not Llama-4'                     #
#           ```                                                                                                                     #
#       were removed in https://github.com/vllm-project/vllm/pull/33293 in favor of new tests in `fusions_e2e`. We                  #
#       avoid replicating the new jobs in this file as it's deprecated.                                                             #
#   * [Basic Models Tests (Extra Initialization) %N]: Only when vLLM model source is modified - test initialization of a            #
#                                                     large subset of supported models (the complement of the small subset in       #
#                                                     the above test.) Also run if model initialization test file is modified.      #
#   * [Language Models Tests (Extra Standard) %N]: Shard slow subset of standard language models tests. Only run when model         #
#                                                  source is modified, or when specified test files are modified.                   #
#   * [Language Models Tests (Hybrid) %N]: Install fast path packages for testing against transformers (mamba, conv1d).             #
#   * [Language Models Test (Extended Generation)]: Install fast path packages for testing against transformers (mamba, conv1d).    #
#   * [Multi-Modal Models (Standard) 1-4]:                                                                                          #
#     - Do NOT remove `VLLM_WORKER_MULTIPROC_METHOD=spawn` setting as ROCm requires this for certain models to function.            #
#   * [Transformers Nightly Models]: Whisper needs `VLLM_WORKER_MULTIPROC_METHOD=spawn` to avoid deadlock.                          #
#   * [Plugin Tests (2 GPUs)]:                                                                                                      #
#     - {`pytest -v -s plugins_tests/test_oot_registration_online.py`}: It needs a clean process                                    #
#     - {`pytest -v -s plugins_tests/test_oot_registration_offline.py`}: It needs a clean process                                   #
#     - {`pytest -v -s plugins_tests/lora_resolvers`}: Unit tests for in-tree lora resolver plugins                                 #
#   * [LoRA TP (Distributed)]:                                                                                                      #
#     - There is some Tensor Parallelism related processing logic in LoRA that requires multi-GPU testing for validation.           #
#     - {`pytest -v -s -x lora/test_gptoss_tp.py`}: Disabled for now because MXFP4 backend on non-cuda platform doesn't support     #
#                                                   LoRA yet.                                                                       #
#   * [Distributed Tests (NxGPUs)(HW-TAG)]: Don't test llama model here, it seems hf implementation is buggy. See:                  #
#                                           https://github.com/vllm-project/vllm/pull/5689                                          #
#   * [Distributed Tests (NxGPUs)(HW-TAG)]: Some old E2E tests were removed in https://github.com/vllm-project/vllm/pull/33293      #
#                                           in favor of new tests in fusions_e2e. We avoid replicating the new jobs in              #
#                                           this file as it's deprecated.                                                           #
#                                                                                                                                   #
#####################################################################################################################################


steps:

- label: ":amd: (MI355) Kimi K3" # TBD
  timeout_in_minutes: 60
  mirror_hardwares: [amdexperimental, amdproduction, amdgfx950nightly, amdmi355]
  dind: false
  agent_pool: mi355_1
  num_gpus: 1
  optional: true
  working_dir: "/vllm-workspace/tests"
  source_file_dependencies:
  - vllm/models/kimi_k3/
  - csrc/libtorch_stable/kimi_k3/
  - tests/models/kimi_k3/
  - vllm/platforms/rocm.py
  commands:
  # Mirrors the ":amd: (MI355) Kimi K3" step generated from
  # .buildkite/test_areas/models_basic.yaml. The ROCm KDA/AttnRes kernels are
  # gated on gfx950, so this has to be MI355. The two kernels/ files the NVIDIA
  # step runs are CUDA-only (they import cuda.bindings.driver), so they are
  # deliberately left out here.
  - pytest -v -s models/kimi_k3

- label: ":amd: (MI355) Kimi K3 Multi-GPU" # TBD
  timeout_in_minutes: 30
  mirror_hardwares: [amdexperimental, amdproduction, amdgfx950nightly, amdmi355]
  dind: false
  agent_pool: mi355_4
  num_gpus: 4
  optional: true
  working_dir: "/vllm-workspace/tests"
  source_file_dependencies:
  - vllm/models/kimi_k3/
  - tests/models/kimi_k3/
  - vllm/platforms/rocm.py
  commands:
  # The single-GPU step above skips every @multi_gpu_test case. `-m "distributed"`
  # selects exactly those: multi_gpu_test() applies pytest.mark.distributed
  # alongside its skipif (tests/utils.py:2080), so this picks up a new
  # multi-GPU test anywhere in the directory without editing this list.
  # Four GPUs run the two tp4 cases in test_amd_latent_moe_runner.py; the tp8
  # case and the 8/16-GPU cases in test_latent_moe_tail.py still skip.
  - pytest -v -s -m "distributed" models/kimi_k3

- label: ":amd: (MI355) Basic Correctness Models %N" # TBD
  timeout_in_minutes: 60
  parallelism: 2
  mirror_hardwares: [amdexperimental, amdproduction, amdgfx950nightly, amdmi355]
  dind: false
  agent_pool: mi355_1
  fast_check: true
  working_dir: "/vllm-workspace/tests"
  source_file_dependencies:
  - vllm/
  - tests/basic_correctness/
  optional: true
  commands:
  - export VLLM_WORKER_MULTIPROC_METHOD=spawn
  - VLLM_TARGET_TEST_SUITE=MI355 pytest -v -s basic_correctness/models --num-shards=$$BUILDKITE_PARALLEL_JOB_COUNT --shard-id=$$BUILDKITE_PARALLEL_JOB

- label: ":amd: (MI355) Basic Correctness CuMem" # TBD
  timeout_in_minutes: 60
  mirror_hardwares: [amdexperimental, amdproduction, amdgfx950nightly, amdmi355]
  dind: false
  agent_pool: mi355_1
  fast_check: true
  working_dir: "/vllm-workspace/tests"
  source_file_dependencies:
  - vllm/
  - tests/basic_correctness/
  optional: true
  commands:
  - export VLLM_WORKER_MULTIPROC_METHOD=spawn
  - pytest -v -s basic_correctness/memory/cumem

- label: ":amd: (MI355) Basic Correctness CPU Offload" # TBD
  timeout_in_minutes: 60
  mirror_hardwares: [amdexperimental, amdproduction, amdgfx950nightly, amdmi355]
  dind: false
  agent_pool: mi355_1
  fast_check: true
  working_dir: "/vllm-workspace/tests"
  source_file_dependencies:
  - vllm/
  - tests/basic_correctness/
  optional: true
  commands:
  - export VLLM_WORKER_MULTIPROC_METHOD=spawn
  - pytest -v -s basic_correctness/cpu_offload

- label: ":amd: (MI355) Basic Correctness Prefetch Offload" # TBD
  timeout_in_minutes: 60
  mirror_hardwares: [amdexperimental, amdproduction, amdgfx950nightly, amdmi355]
  dind: false
  agent_pool: mi355_1
  fast_check: true
  working_dir: "/vllm-workspace/tests"
  source_file_dependencies:
  - vllm/
  - tests/basic_correctness/
  optional: true
  commands:
  - export VLLM_WORKER_MULTIPROC_METHOD=spawn
  - pytest -v -s basic_correctness/prefetch_offload

- label: ":amd: (MI355) Benchmarks CLI" # TBD
  timeout_in_minutes: 40
  mirror_hardwares: [amdexperimental, amdproduction, amdgfx950nightly, amdmi355]
  dind: false
  agent_pool: mi355_1
  optional: true
  working_dir: "/vllm-workspace/tests"
  source_file_dependencies:
  - vllm/
  - tests/benchmarks/
  - rust/src/bench/tests/python_serve_flags.txt
  commands:
  - pytest -v -s benchmarks/

- label: ":amd: (MI355) Attention Benchmark Smoke" # TBD
  timeout_in_minutes: 25
  mirror_hardwares: [amdexperimental, amdproduction, amdgfx950nightly, amdmi355]
  dind: false
  agent_pool: mi355_2
  num_gpus: 2
  optional: true
  working_dir: "/vllm-workspace/"
  source_file_dependencies:
  - benchmarks/attention_benchmarks/
  - vllm/v1/attention/
  - vllm/_aiter_ops.py
  - vllm/platforms/rocm.py
  commands:
  - python3 benchmarks/attention_benchmarks/benchmark.py --backends ROCM_ATTN ROCM_AITER_FA ROCM_AITER_UNIFIED_ATTN --batch-specs "8q1s1k"

- label: ":amd: (MI355) PyTorch Compilation H100 Cases"
  timeout_in_minutes: 45
  mirror_hardwares: [amdexperimental, amdproduction, amdgfx950nightly, amdmi355]
  dind: false
  agent_pool: mi355_1
  num_gpus: 1
  optional: true
  working_dir: "/vllm-workspace/tests"
  source_file_dependencies:
  - vllm/__init__.py
  - vllm/_aiter_ops.py
  - vllm/_custom_ops.py
  - vllm/compilation/
  - vllm/config/
  - vllm/distributed/
  - "!vllm/distributed/kv_transfer/"
  - vllm/engine/
  - vllm/env_override.py
  - vllm/envs.py
  - vllm/forward_context.py
  - vllm/inputs/
  - vllm/ir/
  - vllm/kernels/
  - vllm/logger.py
  - vllm/model_executor/
  - vllm/multimodal/
  - vllm/platforms/
  - vllm/plugins/
  - vllm/sampling_params.py
  - vllm/sequence.py
  - vllm/transformers_utils/
  - vllm/triton_utils/
  - vllm/utils/
  - vllm/v1/
  - tests/compile/h100/
  - tests/utils.py
  - csrc/
  commands:
  - pytest -v -s compile/h100/test_startup.py

- label: ":amd: (MI355) Fusion E2E TP2 AR-RMS FP8 Config Sweep"
  timeout_in_minutes: 45
  mirror_hardwares: [amdexperimental, amdproduction, amdgfx950nightly, amdmi355]
  dind: false
  agent_pool: mi355_2
  num_gpus: 2
  optional: true
  working_dir: "/vllm-workspace/"
  source_file_dependencies:
  - vllm/compilation/
  - vllm/model_executor/
  - vllm/distributed/
  - vllm/v1/attention/
  - vllm/_aiter_ops.py
  - vllm/platforms/rocm.py
  - tests/compile/fusions_e2e/
  - tests/utils.py
  - tests/conftest.py
  - csrc/quantization/
  commands:
  # Existing MI300 jobs own BF16; TP2 Quick owns the excluded Llama cell.
  - amd-smi
  - VLLM_ROCM_USE_AITER=1 VLLM_ROCM_USE_AITER_CUSTOM_AR=1 pytest -v -s tests/compile/fusions_e2e/test_tp2_ar_rms.py -k 'test_tp2_ar_rms_fp8_fusions and Llama-3 and ROCM_AITER_UNIFIED_ATTN and (dynamo_partition or +quant_fp8 or +rms_norm)'

- label: ":amd: (MI355) Fusion E2E TP2 FP8 BF16 rewrites"
  timeout_in_minutes: 45
  mirror_hardwares: [amdexperimental, amdproduction, amdgfx950nightly, amdmi355]
  dind: false
  agent_pool: mi355_2
  num_gpus: 2
  optional: true
  working_dir: "/vllm-workspace/"
  source_file_dependencies:
  - vllm/compilation/
  - vllm/model_executor/
  - vllm/distributed/
  - vllm/v1/attention/
  - vllm/_aiter_ops.py
  - vllm/platforms/rocm.py
  - tests/compile/fusions_e2e/
  - tests/utils.py
  - tests/conftest.py
  - csrc/quantization/
  commands:
  # Dummy-weight rewrite coverage; trained FP8 AR/RMS equivalence is unresolved.
  # TODO: FP4 output-quant and trained MXFP4 AR/RMS fusion remain unsupported.
  - amd-smi
  - VLLM_ROCM_USE_AITER=1 VLLM_ROCM_USE_AITER_CUSTOM_AR=1 pytest -v -s tests/compile/fusions_e2e/test_tp2_ar_rms.py -k 'test_tp2_ar_rms_fp8_fusions and qwen3 and ROCM_AITER_UNIFIED_ATTN and +quant_fp8 and (dynamo_partition or not +rms_norm)'
  - pytest -v -s tests/compile/fusions_e2e/test_tp2_rocm_moe.py

- label: ":amd: (MI355) Fusion and Compile FP8"
  timeout_in_minutes: 45
  mirror_hardwares: [amdexperimental, amdproduction, amdgfx950nightly, amdmi355]
  dind: false
  agent_pool: mi355_2
  num_gpus: 2
  optional: true
  working_dir: "/vllm-workspace/"
  source_file_dependencies:
  - vllm/compilation/
  - vllm/model_executor/layers/
  - vllm/v1/attention/
  - vllm/distributed/
  - vllm/_aiter_ops.py
  - tests/compile/passes/
  - tests/compile/correctness_e2e/test_attn_quant.py
  - vllm/model_executor/kernels/linear/
  - vllm/model_executor/models/llama.py
  commands:
  - amd-smi
  - pytest -v -s tests/compile/passes/test_fusion_attn.py tests/compile/passes/test_silu_mul_quant_fusion.py tests/compile/passes/test_silu_mul_quant_manual_fusion.py
  - pytest -v -s tests/compile/correctness_e2e/test_attn_quant.py

- label: ":amd: (MI355) Sequence Parallel Correctness"
  timeout_in_minutes: 180
  mirror_hardwares: [amdexperimental, amdproduction, amdgfx950nightly, amdmi355]
  dind: false
  agent_pool: mi355_2
  num_gpus: 2
  optional: true
  working_dir: "/vllm-workspace/"
  source_file_dependencies:
  - .buildkite/test_areas/compile.yaml
  - vllm/compilation/
  - vllm/config/
  - vllm/distributed/
  - vllm/model_executor/kernels/linear/
  - vllm/model_executor/layers/
  - vllm/model_executor/models/llama.py
  - vllm/v1/attention/
  - vllm/v1/worker/
  - vllm/v1/cudagraph_dispatcher.py
  - vllm/platforms/rocm.py
  - tests/compile/correctness_e2e/test_sequence_parallel.py
  - tests/models/registry.py
  - tests/utils.py
  commands:
  - export VLLM_TEST_CLEAN_GPU_MEMORY=1
  - pytest -v -s tests/compile/correctness_e2e/test_sequence_parallel.py

- label: ":amd: (MI355) AsyncTP Correctness"
  timeout_in_minutes: 60
  mirror_hardwares: [amdexperimental, amdproduction, amdgfx950nightly, amdmi355]
  dind: false
  agent_pool: mi355_2
  num_gpus: 2
  optional: true
  working_dir: "/vllm-workspace/"
  source_file_dependencies:
  - .buildkite/test_areas/compile.yaml
  - vllm/compilation/
  - vllm/config/
  - vllm/distributed/
  - vllm/model_executor/layers/
  - vllm/model_executor/kernels/linear/
  - vllm/model_executor/models/llama.py
  - vllm/model_executor/models/qwen3.py
  - vllm/v1/attention/
  - vllm/_aiter_ops.py
  - vllm/platforms/rocm.py
  - vllm/transformers_utils/repo_utils.py
  - tests/compile/correctness_e2e/test_async_tp.py
  - tests/compile/fusions_e2e/common.py
  - tests/models/registry.py
  - tests/utils.py
  commands:
  - export VLLM_TEST_CLEAN_GPU_MEMORY=1
  - pytest -v -s tests/compile/correctness_e2e/test_async_tp.py::test_rocm_async_tp_bf16_output_correctness
  - pytest -v -s tests/compile/correctness_e2e/test_async_tp.py::test_async_tp_pass_correctness -k RedHatAI
  - pytest -v -s tests/compile/correctness_e2e/test_async_tp.py::test_async_tp_pass_nvfp4_correctness

- label: ":amd: (MI355) Fusion E2E FP8 Config Sweep"
  timeout_in_minutes: 45
  mirror_hardwares: [amdexperimental, amdproduction, amdgfx950nightly, amdmi355]
  dind: false
  agent_pool: mi355_1
  num_gpus: 1
  optional: true
  working_dir: "/vllm-workspace/"
  source_file_dependencies:
  - .buildkite/test_areas/compile.yaml
  - csrc/quantization/
  - vllm/compilation/
  - vllm/model_executor/
  - vllm/v1/attention/
  - vllm/_aiter_ops.py
  - vllm/platforms/rocm.py
  - tests/compile/fusions_e2e/
  commands:
  - rocm-smi
  - pytest -v -s tests/compile/fusions_e2e/test_tp1_quant.py -k "test_tp1_fp8_fusions and inductor_partition and not +rms_norm and not True and ((Llama-3 and TRITON_ATTN) or (Qwen3-30B and +quant_fp8 and TRITON_ATTN) or (DeepSeek-Coder and +quant_fp8 and TRITON_MLA))"

- label: ":amd: (MI355) EPLB Algorithm" # TBD
  timeout_in_minutes: 30
  mirror_hardwares: [amdexperimental, amdproduction, amdgfx950nightly, amdmi355]
  dind: false
  agent_pool: mi355_1
  optional: true
  working_dir: "/vllm-workspace/tests"
  source_file_dependencies:
  - vllm/distributed/eplb
  - tests/distributed/test_eplb_algo.py
  - tests/distributed/test_eplb_utils.py
  - vllm/platforms/rocm.py
  commands:
  - pytest -v -s distributed/test_eplb_algo.py
  - pytest -v -s distributed/test_eplb_utils.py

- label: ":amd: (MI355) Sharded RDT Weight Transfer"
  timeout_in_minutes: 45
  mirror_hardwares: [amdexperimental, amdproduction, amdgfx950nightly, amdmi355]
  dind: false
  agent_pool: mi355_1
  num_gpus: 1
  optional: true
  working_dir: "/vllm-workspace/tests"
  source_file_dependencies:
  - vllm/distributed/weight_transfer/
  - tests/distributed/test_sharded_rdt_plan.py
  - tests/distributed/test_sharded_rdt_producer.py
  - tests/distributed/test_sharded_rdt_trainer.py
  - vllm/platforms/rocm.py
  commands:
  - export VLLM_WORKER_MULTIPROC_METHOD=spawn
  - uv pip install --system --no-deps 'ray==2.56.1'
  - pytest -v -s distributed/test_sharded_rdt_plan.py
  - pytest -v -s distributed/test_sharded_rdt_producer.py
  - pytest -v -s distributed/test_sharded_rdt_trainer.py

- label: ":amd: (MI355) GEMM-RS-AR"
  timeout_in_minutes: 20
  mirror_hardwares: [amdexperimental, amdproduction, amdgfx950nightly, amdmi355]
  dind: false
  agent_pool: mi355_4
  num_gpus: 4
  optional: true
  working_dir: "/vllm-workspace/"
  source_file_dependencies:
  - .buildkite/test-amd.yaml
  - tests/kernels/test_gemm_rs_ar.py
  - tests/kernels/test_rocm_gemm_rs_ar.py
  - tests/conftest.py
  - vllm/models/common/ops/sequence_parallel.py
  - vllm/model_executor/layers/linear.py
  - vllm/model_executor/layers/utils.py
  - vllm/model_executor/layers/quantization/online/
  - vllm/model_executor/layers/quantization/utils/mxfp8_utils.py
  - vllm/model_executor/kernels/linear/
  - vllm/distributed/
  - vllm/_aiter_ops.py
  - vllm/_custom_ops.py
  - csrc/rocm/skinny_gemms.cu
