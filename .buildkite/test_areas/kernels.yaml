group: Kernels
depends_on: 
  - image-build
steps:
- label: ":nvidia: (H200 MIG 35GB) Core Operation Kernels Shard %N"
  device: h200_35gb
  key: kernels-core-operation-test
  timeout_in_minutes: 120
  source_file_dependencies:
  - csrc/
  - tests/kernels/core
  - tests/kernels/test_concat_mla_q.py
  - tests/kernels/test_fused_qk_norm_rope_gate.py
  commands:
    - pytest -v -s kernels/core --ignore=kernels/core/test_minimax_reduce_rms.py kernels/test_concat_mla_q.py kernels/test_fused_qk_norm_rope_gate.py --shard-id=$$BUILDKITE_PARALLEL_JOB --num-shards=$$BUILDKITE_PARALLEL_JOB_COUNT
  parallelism: 3
  mirror:
    amd:
      label: ":amd: (MI355 DPX) Core Operation Kernels Shard %N"
      dind: false
      device: mi355_dpx
      timeout_in_minutes: 40
      working_dir: "/vllm-workspace/tests"
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - csrc/
      - tests/kernels/core
      - tests/kernels/test_top_k_per_row.py
      - tests/kernels/test_concat_mla_q.py
      - tests/kernels/test_rocm_fp32_router_gemm.py
      - vllm/model_executor/layers/fused_moe/router/gate_linear.py
      - vllm/model_executor/layers/fused_moe/router/rocm_fp32_router_gemm.py
      - vllm/model_executor/layers/rotary_embedding/
      - vllm/_aiter_ops.py
      - vllm/platforms/rocm.py
      - tests/kernels/test_fused_qk_norm_rope_gate.py
      commands:
      - pytest -v -s kernels/core --ignore=kernels/core/test_minimax_reduce_rms.py kernels/test_fused_qk_norm_rope_gate.py kernels/test_concat_mla_q.py kernels/test_top_k_per_row.py kernels/test_rocm_fp32_router_gemm.py --shard-id=$$BUILDKITE_PARALLEL_JOB --num-shards=$$BUILDKITE_PARALLEL_JOB_COUNT
