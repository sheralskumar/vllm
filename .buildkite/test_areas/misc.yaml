group: Miscellaneous
depends_on: 
  - image-build
steps:
- label: ":nvidia: (H200 MIG 18GB) V1 Sample"
  key: v1-sample
  timeout_in_minutes: 35
  device: h200_18gb
  source_file_dependencies: &v1-sample-logits-deps
    - vllm/config/
    - vllm/distributed/
    - "!vllm/distributed/kv_transfer/"
    - vllm/engine/
    - vllm/inputs/
    - vllm/logger.py
    - vllm/model_executor/
    - vllm/platforms/
    - vllm/sampling_params.py
    - vllm/transformers_utils/
    - vllm/utils/
    - vllm/v1/
    - tests/v1/sample
    - tests/v1/logits_processors
    - tests/v1/test_oracle.py
    - tests/v1/test_request.py
    - tests/v1/test_outputs.py
  commands:
    - export VLLM_WORKER_MULTIPROC_METHOD=spawn
    - pytest -v -s v1/sample
  mirror:
    amd:
      label: ":amd: (MI355 DPX) V1 Sample"
      dind: false
      device: mi355_dpx
      timeout_in_minutes: 70
      depends_on:
      - image-build-amd

- label: ":nvidia: (H200 MIG 18GB) V1 Logits + Oracle"
  key: v1-logits-oracle
  timeout_in_minutes: 35
  device: h200_18gb
  source_file_dependencies: *v1-sample-logits-deps
  commands:
    - export VLLM_WORKER_MULTIPROC_METHOD=spawn
    # Keep these in separate pytest processes because the CUDA-initializing
    # correctness tests interfere with the fork-based logits processor tests.
    - pytest -v -s v1/logits_processors
    - pytest -v -s v1/test_oracle.py
    - pytest -v -s v1/test_request.py
    - pytest -v -s v1/test_outputs.py
  mirror:
    amd:
      label: ":amd: (MI355 DPX) V1 Logits + Oracle"
      dind: false
      device: mi355_dpx
      timeout_in_minutes: 70
      depends_on:
      - image-build-amd

- label: ":nvidia: (H200 MIG 35GB) V1 Core"
  device: h200_35gb
  key: v1-core
  timeout_in_minutes: 45
  source_file_dependencies: &v1-core-kv-metrics-deps
    - vllm/config/
    - vllm/distributed/
    - "!vllm/distributed/kv_transfer/"
    - vllm/engine/
    - vllm/entrypoints/pooling/
    - vllm/inputs/
    - vllm/lora/
    - vllm/model_executor/
    - vllm/multimodal/
    - vllm/outputs.py
    - vllm/platforms/
    - vllm/pooling_params.py
    - vllm/profiler/
    - vllm/sampling_params.py
    - vllm/tokenizers/
    - vllm/transformers_utils/
    - vllm/utils/
    - vllm/v1/
    - tests/v1/core
    - tests/v1/executor
    - tests/v1/kv_offload
    - tests/v1/simple_kv_offload
    - tests/v1/worker
    - tests/v1/streaming_input
    - tests/v1/kv_connector/unit
    - tests/v1/ec_connector/unit
    - tests/v1/metrics
    - tests/entrypoints/openai/correctness/test_lmeval.py
  commands:
    - export VLLM_WORKER_MULTIPROC_METHOD=spawn
    - pytest -v -s -m 'not cpu_test' v1/core
  mirror:
    amd:
      label: ":amd: (MI355 DPX) V1 Core"
      dind: false
      device: mi355_dpx
      timeout_in_minutes: 60
      depends_on:
      - image-build-amd

- label: ":nvidia: (H200 MIG 18GB) V1 Executor + Worker"
  device: h200_18gb
  key: v1-executor-worker
  timeout_in_minutes: 45
  source_file_dependencies: *v1-core-kv-metrics-deps
  commands:
    - export VLLM_WORKER_MULTIPROC_METHOD=spawn
    # split the test to avoid interference
    - pytest -v -s v1/executor
    - pytest -v -s v1/worker
    - pytest -v -s v1/streaming_input
  mirror:
    amd:
      label: ":amd: (MI355 DPX) V1 Executor + Worker"
      dind: false
      device: mi355_dpx
      timeout_in_minutes: 60
      depends_on:
      - image-build-amd

- label: ":nvidia: (H200 MIG 35GB) V1 KV Offload"
  device: h200_35gb
  key: v1-kv-offload
  timeout_in_minutes: 45
  source_file_dependencies: *v1-core-kv-metrics-deps
  commands:
    - export VLLM_WORKER_MULTIPROC_METHOD=spawn
    - bash /vllm-workspace/.buildkite/scripts/install-kv-offload.sh
    - pytest -v -s v1/kv_offload
    - pytest -v -s v1/simple_kv_offload
  mirror:
    amd:
      label: ":amd: (MI355 DPX) V1 KV Offload"
      dind: false
      device: mi355_dpx
      timeout_in_minutes: 60
      depends_on:
      - image-build-amd

- label: ":nvidia: (H200 MIG 35GB) V1 KV Connectors Shard %N"
  device: h200_35gb
  key: v1-kv-connectors
  timeout_in_minutes: 45
  parallelism: 4
  source_file_dependencies: *v1-core-kv-metrics-deps
  commands:
    - bash /vllm-workspace/.buildkite/scripts/install-kv-connectors.sh
    - export VLLM_WORKER_MULTIPROC_METHOD=spawn
    - pytest -v -s -m 'not cpu_test' v1/kv_connector/unit --num-shards=$$BUILDKITE_PARALLEL_JOB_COUNT --shard-id=$$BUILDKITE_PARALLEL_JOB
    - pytest -v -s -m 'not cpu_test' v1/ec_connector/unit --num-shards=$$BUILDKITE_PARALLEL_JOB_COUNT --shard-id=$$BUILDKITE_PARALLEL_JOB
  mirror:
    amd:
      label: ":amd: (MI355 DPX) V1 KV Connectors Shard %N"
      dind: false
      device: mi355_dpx
      timeout_in_minutes: 60
      depends_on:
      - image-build-amd

- label: ":nvidia: (H200 MIG 35GB) V1 Metrics + LM Eval"
  device: h200_35gb
  key: v1-metrics-lmeval
  timeout_in_minutes: 45
  env:
    # GitHub intermittently rejects HTTP/2 upload-pack requests from the H200
    # CI image. Force Git's smart protocol to use HTTP/1.1 for source installs.
    GIT_CONFIG_COUNT: "1"
    GIT_CONFIG_KEY_0: http.version
    GIT_CONFIG_VALUE_0: HTTP/1.1
    GIT_TERMINAL_PROMPT: "0"
  source_file_dependencies: *v1-core-kv-metrics-deps
  commands:
    - export VLLM_WORKER_MULTIPROC_METHOD=spawn
    - pytest -v -s -m 'not cpu_test' v1/metrics
    # Integration test for streaming correctness (requires special branch).
    - pip install -U git+https://github.com/vllm-project/lm-evaluation-harness.git@streaming-api
    - pytest -v -s entrypoints/openai/correctness/test_lmeval.py::test_lm_eval_accuracy_v1_engine
  mirror:
    amd:
      label: ":amd: (MI355 DPX) V1 Metrics + LM Eval"
      dind: false
      device: mi355_dpx
      timeout_in_minutes: 65
      depends_on:
      - image-build-amd

- label: ":nvidia: (H200 MIG 18GB) Regression"
  key: regression
  timeout_in_minutes: 30
  device: h200_18gb
  source_file_dependencies:
  - vllm/config/
  - vllm/distributed/
  - "!vllm/distributed/kv_transfer/"
  - vllm/engine/
  - vllm/inputs/
  - vllm/model_executor/
  - vllm/multimodal/
  - vllm/platforms/
  - vllm/sampling_params.py
  - vllm/transformers_utils/
  - vllm/utils/
  - vllm/v1/
  - tests/test_regression
  commands:
  - pip install 'modelscope<1.38'
  - pytest -v -s test_regression.py
  working_dir: "/vllm-workspace/tests" # optional
  mirror:
    amd:
      label: ":amd: (MI355 DPX) Regression"
      dind: false
      device: mi355_dpx
      timeout_in_minutes: 25
      depends_on:
      - image-build-amd
      working_dir: /vllm-workspace/tests

- label: ":nvidia: (H200 MIG 35GB) Examples"
  device: h200_35gb
  key: examples
  timeout_in_minutes: 40
  working_dir: "/vllm-workspace/examples"
  source_file_dependencies:
  - vllm/entrypoints
  - vllm/multimodal
  - examples/
  commands:
    - pip install --no-deps tensorizer # for tensorizer test
     # for basic
    - python3 basic/offline_inference/chat.py
    - python3 basic/offline_inference/generate.py --model facebook/opt-125m
    - python3 basic/offline_inference/generate.py --model meta-llama/Llama-2-13b-chat-hf --cpu-offload-gb 10
    - python3 basic/offline_inference/classify.py
    - python3 basic/offline_inference/embed.py
    - python3 basic/offline_inference/score.py
    # for multi-modal models
    - python3 generate/multimodal/audio_language_offline.py --seed 0
    - python3 generate/multimodal/vision_language_offline.py --seed 0
    - python3 generate/multimodal/vision_language_multi_image_offline.py --seed 0
    - python3 generate/multimodal/encoder_decoder_multimodal_offline.py --model-type whisper --seed 0
     # for pooling models
    - python3 pooling/embed/vision_embedding_offline.py --seed 0
    # for features demo
    - python3 features/automatic_prefix_caching/prefix_caching_offline.py
    - python3 deployment/llm_engine_example.py
    - python3 features/tensorize_vllm_model.py --model facebook/opt-125m serialize --serialized-directory /tmp/ --suffix v1 && python3 features/tensorize_vllm_model.py --model facebook/opt-125m deserialize --path-to-tensors /tmp/vllm/facebook/opt-125m/v1/model.tensors
    - python3 features/speculative_decoding/spec_decode_offline.py --test --method eagle --num_spec_tokens 3 --dataset-name hf --dataset-path philschmid/mt-bench --num-prompts 80 --temp 0 --top-p 1.0 --top-k -1 --tp 1 --enable-chunked-prefill --max-model-len 2048
    # https://github.com/vllm-project/vllm/pull/26682 uses slightly more memory in PyTorch 2.9+ causing this test to OOM in 1xL4 GPU
    - python3 features/speculative_decoding/spec_decode_offline.py --test --method eagle3 --num_spec_tokens 3 --dataset-name hf --dataset-path philschmid/mt-bench --num-prompts 80 --temp 0 --top-p 1.0 --top-k -1 --tp 1 --enable-chunked-prefill --max-model-len 1536
  mirror:
    amd:
      label: ":amd: (MI355 DPX) Examples"
      dind: false
      device: mi355_dpx
      timeout_in_minutes: 75
      source_file_dependencies:
      - vllm/entrypoints
      - vllm/multimodal
      - examples/
      - vllm/platforms/rocm.py
      depends_on:
      - image-build-amd
