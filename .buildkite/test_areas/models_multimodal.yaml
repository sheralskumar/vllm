group: Models - Multimodal
depends_on: 
  - image-build
steps:
- label: ":nvidia: (H200 MIG 18GB) Multimodal Models (Standard) 1: qwen2"
  key: multi-modal-models-standard-1-qwen2
  timeout_in_minutes: 68
  device: h200_18gb
  source_file_dependencies:
  - vllm/
  - "!vllm/distributed/kv_transfer/"
  - tests/models/multimodal
  commands:
    - pytest -v -s models/multimodal/generation/test_common.py -m core_model -k "qwen2"
    - pytest -v -s models/multimodal/generation/test_ultravox.py -m core_model
  mirror:
    amd:
      label: ":amd: (MI355 DPX) Multimodal Models (Standard) 1: qwen2"
      dind: false
      device: mi355_dpx
      timeout_in_minutes: 65
      depends_on:
      - image-build-amd

- label: ":nvidia: (H200 MIG 18GB) Multimodal Models (Standard) 2: qwen3 + gemma"
  key: multi-modal-models-standard-2-qwen3-gemma
  timeout_in_minutes: 75
  device: h200_18gb
  source_file_dependencies:
  - vllm/
  - "!vllm/distributed/kv_transfer/"
  - tests/models/multimodal
  commands:
    - pytest -v -s models/multimodal/generation/test_common.py -m core_model -k "qwen3 or gemma"
    - pytest -v -s models/multimodal/generation/test_mm_prefix_lm.py -m core_model
    - pytest -v -s models/multimodal/generation/test_qwen2_5_vl.py -m core_model
  mirror:
    amd:
      label: ":amd: (MI355 DPX) Multimodal Models (Standard) 2: qwen3 + gemma"
      dind: false
      device: mi355_dpx
      timeout_in_minutes: 55
      depends_on:
      - image-build-amd

- label: ":nvidia: (H200 MIG 35GB) Multimodal Models (Standard) 4: other + whisper"
  device: h200_35gb
  key: multi-modal-models-standard-4-other-whisper
  timeout_in_minutes: 75
  source_file_dependencies:
  - vllm/
  - "!vllm/distributed/kv_transfer/"
  - tests/models/multimodal
  commands:
    - pytest -v -s models/multimodal -m core_model --ignore models/multimodal/generation/test_common.py --ignore models/multimodal/generation/test_ultravox.py --ignore models/multimodal/generation/test_qwen2_5_vl.py --ignore models/multimodal/generation/test_qwen2_vl.py --ignore models/multimodal/generation/test_whisper.py --ignore models/multimodal/generation/test_mm_prefix_lm.py --ignore models/multimodal/generation/test_memory_leak.py --ignore models/multimodal/generation/test_vit_cudagraph.py --ignore models/multimodal/processing
    - pytest -v -s models/multimodal/generation/test_vit_cudagraph.py -m core_model
    - pytest models/multimodal/generation/test_memory_leak.py -m core_model
    - cd .. && VLLM_WORKER_MULTIPROC_METHOD=spawn pytest -v -s tests/models/multimodal/generation/test_whisper.py -m core_model  # Otherwise, mp_method="spawn" doesn't work
  mirror:
    amd:
      label: ":amd: (MI355 DPX) Multimodal Models (Standard) 4: other + whisper"
      dind: false
      device: mi355_dpx
      timeout_in_minutes: 70
      depends_on:
      - image-build-amd

- label: ":nvidia: (H200 MIG 18GB) Multimodal Processor Shard %N"
  key: multi-modal-processor
  timeout_in_minutes: 98
  device: h200_18gb
  parallelism: 4
  source_file_dependencies:
  - vllm/
  - "!vllm/distributed/kv_transfer/"
  - tests/models/multimodal
  - tests/models/registry.py
  commands:
    - pytest -v -s models/multimodal/processing/test_tensor_schema.py --num-shards=$$BUILDKITE_PARALLEL_JOB_COUNT --shard-id=$$BUILDKITE_PARALLEL_JOB
  mirror:
    amd:
      label: ":amd: (MI355 DPX) Multimodal Processor Shard %N"
      dind: false
      device: mi355_dpx
      parallelism: 4
      timeout_in_minutes: 115
      depends_on:
      - image-build-amd

- label: ":nvidia: (H200 MIG 35GB) Multimodal Accuracy Eval (Small Models)"
  device: h200_35gb
  key: multi-modal-accuracy-eval-small-models
  timeout_in_minutes: 30
  working_dir: "/vllm-workspace/.buildkite/lm-eval-harness"
  source_file_dependencies:
  - vllm/multimodal/
  - vllm/inputs/
  - vllm/v1/core/
  commands:
  - pytest -s -v test_lm_eval_correctness.py --config-list-file=configs/models-mm-small.txt --tp-size=1
  mirror:
    amd:
      label: ":amd: (MI355 DPX) Multimodal Accuracy Eval (Small Models)"
      dind: false
      device: mi355_dpx
      timeout_in_minutes: 35
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - vllm/multimodal/
      - vllm/inputs/
      - vllm/v1/core/
      - vllm/platforms/rocm.py
      - vllm/model_executor/model_loader/
