group: Spec Decode
depends_on:
  - image-build
steps:
- label: ":nvidia: (H200 MIG 35GB) V1 Spec Decode"
  device: h200_35gb
  key: v1-spec-decode
  timeout_in_minutes: 40
  source_file_dependencies:
    - vllm/config/
    - vllm/distributed/
    - "!vllm/distributed/kv_transfer/"
    - vllm/inputs/
    - vllm/model_executor/
    - vllm/models/qwen4_exp/
    - vllm/platforms/
    - vllm/sampling_params.py
    - vllm/transformers_utils/
    - vllm/utils/
    - vllm/v1/
    - tests/v1/spec_decode
  commands:
    - export VLLM_WORKER_MULTIPROC_METHOD=spawn
    # TODO: create another `optional` test group for slow tests
    - pytest -v -s -m 'not slow_test' v1/spec_decode
  mirror:
    amd:
      label: ":amd: (MI355 DPX) V1 Spec Decode"
      dind: false
      device: mi355_dpx
      timeout_in_minutes: 50
      depends_on:
      - image-build-amd

- label: ":nvidia: (H200 MIG 35GB) Spec Decode Eagle 1: DeepSeek + Qwen"
  key: spec-decode-eagle-1-deepseek-qwen
  timeout_in_minutes: 25
  device: h200_35gb
  source_file_dependencies:
    - vllm/v1/spec_decode/
    - vllm/v1/worker/gpu/spec_decode/
    - tests/v1/e2e/spec_decode/
  commands:
    - pytest -v -s v1/e2e/spec_decode/eagle/ -k "deepseek_eagle or qwen3_eagle3"
  mirror:
    amd:
      label: ":amd: (MI355 DPX) Spec Decode Eagle 1: DeepSeek + Qwen"
      dind: false
      device: mi355_dpx
      timeout_in_minutes: 60
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - vllm/v1/spec_decode/
      - vllm/v1/worker/gpu/spec_decode/
      - vllm/model_executor/model_loader/
      - vllm/v1/sample/
      - vllm/model_executor/layers/
      - tests/v1/e2e/spec_decode/
      - vllm/platforms/rocm.py

- label: ":nvidia: (H200 MIG 35GB) Spec Decode Eagle 2: Llama 3 + Qwen VL + Other"
  key: spec-decode-eagle-2-llama3-qwen-vl-other
  timeout_in_minutes: 25
  device: h200_35gb
  source_file_dependencies:
    - vllm/v1/spec_decode/
    - vllm/v1/worker/gpu/spec_decode/
    - tests/v1/e2e/spec_decode/
  commands:
    - pytest -v -s v1/e2e/spec_decode/eagle/ -k "not deepseek_eagle and not qwen3_eagle3"
  mirror:
    amd:
      label: ":amd: (MI355 DPX) Spec Decode Eagle 2: Llama 3 + Qwen VL + Other"
      dind: false
      device: mi355_dpx
      timeout_in_minutes: 60
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - vllm/v1/spec_decode/
      - vllm/v1/worker/gpu/spec_decode/
      - vllm/model_executor/model_loader/
      - vllm/v1/sample/
      - vllm/model_executor/layers/
      - tests/v1/e2e/spec_decode/
      - vllm/platforms/rocm.py

- label: ":nvidia: (H200 MIG 35GB) Spec Decode N-Gram + Suffix"
  key: spec-decode-ngram-suffix
  timeout_in_minutes: 20
  device: h200_35gb
  source_file_dependencies:
    - vllm/v1/spec_decode/
    - vllm/v1/worker/gpu/spec_decode/
    - tests/v1/e2e/spec_decode/
    - tests/spec_decode/
  commands:
    - pytest -v -s v1/e2e/spec_decode/ngram_suffix/
    - python3 spec_decode/test_custom_proposer.py
  mirror:
    amd:
      label: ":amd: (MI355 DPX) Spec Decode N-Gram + Suffix"
      dind: false
      device: mi355_dpx
      timeout_in_minutes: 35
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - vllm/v1/spec_decode/
      - vllm/v1/worker/gpu/spec_decode/
      - vllm/model_executor/model_loader/
      - vllm/v1/sample/
      - vllm/model_executor/layers/
      - tests/v1/e2e/spec_decode/
      - vllm/platforms/rocm.py

- label: ":nvidia: (H200 MIG 18GB) Spec Decode Draft Model"
  key: spec-decode-draft-model
  timeout_in_minutes: 60
  device: h200_18gb
  source_file_dependencies:
    - vllm/v1/spec_decode/
    - vllm/v1/worker/gpu/spec_decode/
    - tests/v1/e2e/spec_decode/
  commands:
    - pytest -v -s v1/e2e/spec_decode/draft_model/
  mirror:
    amd:
      label: ":amd: (MI355 DPX) Spec Decode Draft Model"
      dind: false
      device: mi355_dpx
      timeout_in_minutes: 60
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - vllm/v1/spec_decode/
      - vllm/v1/worker/gpu/spec_decode/
      - vllm/model_executor/model_loader/
      - vllm/v1/sample/
      - vllm/model_executor/layers/
      - tests/v1/e2e/spec_decode/
      - vllm/platforms/rocm.py
